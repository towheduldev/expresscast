name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests, lint, and builds
        run: ./gradlew :shared:test :phone:testDebugUnitTest :phone:lintDebug :tv:lintDebug :phone:assembleDebug :tv:assembleDebug :phone:assembleRelease :tv:assembleRelease --console=plain
